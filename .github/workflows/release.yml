name: Release Compiler

on:
  push:
    tags:
      - "v*"

jobs:
  # JOB 1: Parallel Compilation
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            os: ubuntu-latest
          - target: bun-linux-arm64
            os: ubuntu-latest
          - target: bun-darwin-x64
            os: macos-latest
          - target: bun-darwin-arm64
            os: macos-latest
          - target: bun-windows-x64-baseline
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install

      # Only run apt commands on Linux runners
      - name: Install 7zip (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install p7zip-full p7zip-rar

      # Use brew for macOS runners
      - name: Install 7zip (macOS)
        if: runner.os == 'macOS'
        run: brew install p7zip

      # (Windows already has 7z pre-installed in the GitHub Actions environment)

      - name: Run Build Script
        # Pass the matrix target to your script
        run: bun run build.ts ${{ matrix.target }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/*.zip
          retention-days: 1

  # JOB 2: Aggregate and Release
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-dist
          pattern: bin-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./all-dist/*.zip
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
