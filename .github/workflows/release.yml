name: Release Compiler

on:
  push:
    tags:
      - "v*" # Triggers whenever you push a tag starting with 'v'

jobs:
  build:
    name: Build and Release
    runs-on: windows-latest
    permissions:
      contents: write # Important: Allows the action to create the release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install Dependencies
        run: bun install

      - name: Run Build Script
        run: bun run build # This runs your scripts/build.ts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/* # Uploads everything in your dist folder
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
